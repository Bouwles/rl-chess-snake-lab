[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-chess-snake-lab"
version = "0.1.0"
description = "Small reinforcement learning agents for Snake and Chess using Python and PyTorch."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Paul Nercessian", email = "122783688+Bouwles@users.noreply.github.com" }
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "python-chess>=1.999",
  "gymnasium>=0.29",
  "pillow>=10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
include = ["rl_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
